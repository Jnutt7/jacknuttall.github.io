<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack Nuttall — Mechanical Engineering Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F3EF;
    --paper-alt:#EAEBE5;
    --ink:#161F2B;
    --ink-soft:#4A5568;
    --line:#C7CCC3;
    --line-strong:#9AA29A;
    --orange:#CB4E23;
    --blue:#2F5C87;
    --card-bg:#FBFBF9;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper-alt);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

  .sheet{max-width:1240px;margin:0 auto;background:var(--paper);border-left:1px solid var(--line-strong);border-right:1px solid var(--line-strong);position:relative;padding:28px 28px 0;}
  .tick{position:absolute;width:16px;height:16px;z-index:3;}
  .tick::before,.tick::after{content:"";position:absolute;background:var(--ink);}
  .tick::before{width:16px;height:1.5px;top:0;left:0;}
  .tick::after{width:1.5px;height:16px;top:0;left:0;}
  .tick.tl{top:10px;left:10px;}
  .tick.tr{top:10px;right:10px;transform:scaleX(-1);}
  .tick.bl{bottom:10px;left:10px;transform:scaleY(-1);}
  .tick.br{bottom:10px;right:10px;transform:scale(-1,-1);}
  .inner{border:1px solid var(--line-strong);}

  /* header / title block */
  header{display:grid;grid-template-columns:1.4fr 1fr;border-bottom:1px solid var(--line-strong);}
  .title-main{padding:50px 40px 30px;border-right:1px solid var(--line-strong);}
  .doc-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:20px;transition:opacity .2s ease;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(34px,5vw,60px);line-height:0.98;margin:0 0 10px;letter-spacing:-0.01em;}
  #tagline{font-family:'Space Grotesk',sans-serif;font-size:18px;color:var(--blue);margin:0;font-weight:500;}
  .name-row{display:flex;align-items:center;gap:24px;margin-bottom:16px;}
  .headshot{width:104px;height:104px;object-fit:cover;border:1px solid var(--ink);flex-shrink:0;background:var(--card-bg);}
  .name-col{min-width:0;}
  #lede{max-width:56ch;font-size:15.5px;line-height:1.65;color:var(--ink-soft);margin:0;}
  .title-block{display:flex;flex-direction:column;}
  .tb-row{padding:13px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;font-size:13.5px;}
  .tb-row:last-child{border-bottom:none;}
  .tb-row .label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;color:var(--ink-soft);padding-top:2px;white-space:nowrap;}
  .tb-row .val{text-align:right;}
  .tb-row .val a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue);}
  .tb-row .val a:hover{color:var(--orange);border-color:var(--orange);}
  .tb-row.grow{flex:1;align-items:flex-start;}
  .edu-item{margin-bottom:4px;}
  .edu-item:last-child{margin-bottom:0;}
  .edu-item .deg{font-weight:600;}
  .edu-item .sch{color:var(--ink-soft);font-size:12.5px;}

  /* tab bar */
  .tabbar{display:flex;border-bottom:1px solid var(--line-strong);background:var(--paper);position:sticky;top:0;z-index:5;}
  .tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;letter-spacing:.04em;
    padding:16px 26px;
    background:none;border:none;border-right:1px solid var(--line);
    color:var(--ink-soft);cursor:pointer;
    display:flex; align-items:center; gap:10px;
  }
  .tab .num{color:var(--orange);}
  .tab:hover{color:var(--ink); background:var(--paper-alt);}
  .tab.active{color:var(--ink);background:var(--card-bg);font-weight:600;box-shadow:inset 0 -2px 0 var(--orange);}

  main{min-height:520px;}
  .panel{display:none;padding:48px 40px 60px;animation:fadeIn .35s ease;}
  .panel.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:32px;}
  .sec-num{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--orange);border:1px solid var(--orange);padding:2px 8px;border-radius:2px;}
  .sec-head h2{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;margin:0;}

  /* about */
  .about-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:44px;}
  .about-grid p{font-size:16px;line-height:1.75;margin:0 0 16px;max-width:62ch;}
  .side-card{background:var(--card-bg);border:1px solid var(--line);padding:22px 24px;margin-bottom:20px;}
  .side-card:last-child{margin-bottom:0;}
  .side-card h3{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--ink-soft);margin:0 0 14px;text-transform:uppercase;}
  .chip-group{margin-bottom:14px;}
  .chip-group:last-child{margin-bottom:0;}
  .chip-group .gname{font-size:12.5px;font-weight:600;color:var(--blue);margin-bottom:8px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--paper);border:1px solid var(--line-strong);padding:4px 9px;color:var(--ink);}
  .about-photo{width:100%;display:block;border:1px solid var(--line-strong);object-fit:cover;max-height:320px;}
  .photo-caption{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin:8px 0 16px;}
  .music-link{width:100%;justify-content:center;box-sizing:border-box;}

  /* experience */
  .exp-card{border:1px solid var(--line-strong);background:var(--card-bg);margin-bottom:26px;}
  .exp-card:last-child{margin-bottom:0;}
  .exp-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;padding:22px 26px 16px;border-bottom:1px solid var(--line);}
  .exp-top .co{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;}
  .exp-top .loc{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .exp-top .dates{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
  .exp-role{padding:16px 26px 0;color:var(--blue);font-weight:500;font-size:14.5px;}
  .exp-metrics{display:flex;gap:0;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0;}
  .exp-metrics .m{flex:1;min-width:120px;padding:14px 26px;border-right:1px solid var(--line);}
  .exp-metrics .m:last-child{border-right:none;}
  .exp-metrics .m .n{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:var(--orange);}
  .exp-metrics .m .l{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em;}
  .exp-list{margin:0;padding:0 26px 24px;list-style:none;display:grid;gap:12px;}
  .exp-list li{display:grid;grid-template-columns:16px 1fr;gap:12px;font-size:15px;line-height:1.6;}
  .exp-list li::before{content:"—";color:var(--orange);font-family:'IBM Plex Mono',monospace;}

  /* projects */
  .project{border:1px solid var(--line-strong);background:var(--card-bg);margin-bottom:28px;display:grid;grid-template-columns:0.85fr 1.15fr;}
  .project:last-child{margin-bottom:0;}
  .project.reverse{grid-template-columns:1.15fr 0.85fr;}
  .project.reverse .p-media{order:2;border-right:none;border-left:1px solid var(--line-strong);}
  .project.reverse .p-body{order:1;}
  .p-media{position:relative;border-right:1px solid var(--line-strong);background:var(--ink);min-height:240px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .p-media img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92;}
  .p-media svg{width:56%;opacity:.85;}
  .p-media .tag{position:absolute;top:14px;left:14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;background:var(--paper);color:var(--ink);padding:4px 9px;border:1px solid var(--ink);}
  .p-body{padding:30px 32px;}
  .p-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
  .p-title{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:600;margin:0 0 4px;}
  .p-role{color:var(--blue);font-size:14px;font-weight:500;margin-bottom:16px;}
  .p-desc{font-size:15px;line-height:1.65;margin:0 0 18px;}
  .p-specs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .p-specs .spec .n{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--orange);line-height:1.1;}
  .p-specs .spec .l{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);margin-top:4px;}
  details.p-notes{margin-bottom:18px;}
  details.p-notes summary{cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--blue);list-style:none;display:flex;align-items:center;gap:8px;}
  details.p-notes summary::-webkit-details-marker{display:none;}
  details.p-notes summary::before{content:"+";color:var(--orange);font-weight:700;width:14px;}
  details.p-notes[open] summary::before{content:"–";}
  details.p-notes ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:9px;}
  details.p-notes li{font-size:13.5px;line-height:1.55;color:var(--ink-soft);padding-left:16px;position:relative;}
  details.p-notes li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:1.5px;background:var(--blue);}
  .p-link{display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);text-decoration:none;border:1px solid var(--ink);padding:9px 16px;transition:background .15s ease,color .15s ease;}
  .p-link:hover{background:var(--orange);border-color:var(--orange);color:var(--paper);}

  footer{padding:36px 40px 46px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;border-top:1px solid var(--line-strong);}
  footer .fname{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;}
  footer .fmeta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:6px;}
  footer .flinks{display:flex;gap:22px;font-size:13.5px;}
  footer .flinks a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-strong);}
  footer .flinks a:hover{color:var(--orange);border-color:var(--orange);}

  @media (max-width:820px){
    .sheet{padding:16px 16px 0;}
    header{grid-template-columns:1fr;}
    .title-main{border-right:none;border-bottom:1px solid var(--line-strong);padding:44px 20px 26px;}
    .tb-row{padding:11px 20px;}
    .tabbar{overflow-x:auto;}
    .tab{padding:14px 18px;white-space:nowrap;}
    .panel{padding:36px 20px 48px;}
    .about-grid{grid-template-columns:1fr;}
    .project,.project.reverse{grid-template-columns:1fr;}
    .project.reverse .p-media{order:1;}
    .project.reverse .p-body{order:2;}
    .p-media{min-height:190px;border-right:none !important;border-bottom:1px solid var(--line-strong);}
    .p-body{padding:24px 20px;}
    .exp-top,.exp-role,.exp-list{padding-left:20px;padding-right:20px;}
    .exp-metrics .m{padding:12px 20px;}
    footer{padding:32px 20px 40px;}
  }
</style>
</head>

    <main>
      <section class="panel active" id="panel-about">

        <div class="about-grid">
          <div id="aboutText"></div>
          <div id="aboutSide"></div>
        </div>
      </section>

      <section class="panel" id="panel-experience">
        <div class="sec-head"><span class="sec-num">02</span><h2>Experience</h2></div>
        <div id="expList"></div>
      </section>

      <section class="panel" id="panel-projects">
        <div class="sec-head"><span class="sec-num">03</span><h2>Projects</h2></div>
        <div id="projList"></div>
      </section>
    </main>

    <footer>
      <div>
        <div class="fname" id="footName"></div>
        <div class="fmeta" id="footMeta"></div>
      </div>
      <div class="flinks" id="footLinks"></div>
    </footer>

  </div>
</div>

  about: {
    paragraphs: [
      "I'm a mechanical engineering student at USC, now working toward a combined Master's in Product Development Engineering. Most recently I interned at DZYNE Technologies / Ondas Sentinel in Irvine, designing a lightweight launcher for expendable UAVs from concept through early production. Before that, I spent a year and a half at Abbott Laboratories building inspection tooling and rework processes for leadless pacemakers.",
      "Outside of internships, I lead hands-on builds through USC Makers and my senior capstone — right now that means managing a four-person team designing a UAV that automatically repositions its own battery to correct for shifting center of gravity mid-flight. I like problems where a mechanism has to work precisely and repeatably under real constraints, not just once on a bench.",
      "I'm originally from Narragansett, Rhode Island, and I'm still getting used to — and really enjoying — life on the west coast. Outside of engineering, I'm usually listening to blues and R&B, lifting weights, at the beach, fishing, or spending time with my church community.",

const UAV_ICON = `<svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#F2F3EF" stroke-width="1.6">
  <ellipse cx="100" cy="70" rx="14" ry="7"/>
  <line x1="14" y1="70" x2="186" y2="70"/>
  <line x1="100" y1="63" x2="100" y2="30"/>
  <line x1="80" y1="30" x2="120" y2="30"/>
  <rect x="88" y="66" width="24" height="10" rx="2"/>
  <circle cx="60" cy="70" r="2.4" fill="#CB4E23" stroke="none"/>
  <circle cx="140" cy="70" r="2.4" fill="#CB4E23" stroke="none"/>

  <line x1="106" y1="76" x2="106" y2="94" stroke-dasharray="3 3"/>

</svg>`;

function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

function renderHeader(){
  document.getElementById('fullName').textContent = SITE_DATA.person.name;
  document.getElementById('tagline').textContent = SITE_DATA.person.tagline;
  const headshotEl = document.getElementById('headshot');
  headshotEl.src = SITE_DATA.person.photo;
  headshotEl.alt = SITE_DATA.person.name;
  document.getElementById('lede').textContent = SITE_DATA.person.lede;

  const tb = document.getElementById('titleBlock');
  tb.innerHTML = '';
  const rows = [
    ['LOCATION', SITE_DATA.person.location],
    ['EMAIL', `<a href="mailto:${SITE_DATA.person.email}">${SITE_DATA.person.email}</a>`],
    ['PHONE', SITE_DATA.person.phone],
    ['LINKEDIN', `<a href="${SITE_DATA.person.linkedinUrl}" target="_blank" rel="noopener">${SITE_DATA.person.linkedinLabel}</a>`]
  ];
  rows.forEach(([label,val])=>{
    const row = el('div','tb-row');
    row.innerHTML = `<span class="label">${label}</span><span class="val">${val}</span>`;
    tb.appendChild(row);
  });
  const eduRow = el('div','tb-row grow');
  const eduHtml = SITE_DATA.education.map(e=>`<div class="edu-item"><span class="deg">${e.degree}</span><br><span class="sch">${e.school} · ${e.date}</span></div>`).join('');
  eduRow.innerHTML = `<span class="label">EDUCATION</span><span class="val">${eduHtml}</span>`;
  tb.appendChild(eduRow);

  document.getElementById('footName').textContent = SITE_DATA.person.name;
  document.getElementById('footMeta').textContent = `${SITE_DATA.person.location} · ${SITE_DATA.education[SITE_DATA.education.length-1].degree}`;
  const fl = document.getElementById('footLinks');
  fl.innerHTML = `<a href="mailto:${SITE_DATA.person.email}">Email</a><a href="${SITE_DATA.person.linkedinUrl}" target="_blank" rel="noopener">LinkedIn</a>`;
}

function renderAbout(){
  const text = document.getElementById('aboutText');
  text.innerHTML = SITE_DATA.about.paragraphs.map(p=>`<p>${p}</p>`).join('');

  const side = document.getElementById('aboutSide');
  side.innerHTML = '';
  const card = el('div','side-card');
  card.appendChild(el('h3', null, 'Skills'));
  SITE_DATA.skills.forEach(group=>{
    const g = el('div','chip-group');
    g.appendChild(el('div','gname', group.category));
    const chips = el('div','chips');
    group.items.forEach(item=> chips.appendChild(el('span','chip', item)));
    g.appendChild(chips);
    card.appendChild(g);
  });
  side.appendChild(card);

  const musicCard = el('div','side-card');
  musicCard.appendChild(el('h3', null, 'Off the Clock'));
  musicCard.appendChild(el('img','about-photo', ''));
  musicCard.querySelector('.about-photo').src = SITE_DATA.about.photo;
  musicCard.querySelector('.about-photo').alt = SITE_DATA.about.photoCaption;
  musicCard.appendChild(el('div','photo-caption', SITE_DATA.about.photoCaption));
  musicCard.appendChild(el('a','p-link music-link', `${SITE_DATA.person.spotifyLabel} ↗`));
  const musicLink = musicCard.querySelector('.music-link');
  musicLink.href = SITE_DATA.person.spotifyUrl;
  musicLink.target = '_blank';
  musicLink.rel = 'noopener';
  side.appendChild(musicCard);
}

function renderExperience(){
  const wrap = document.getElementById('expList');
  wrap.innerHTML = '';
  SITE_DATA.experience.forEach(job=>{
    const card = el('div','exp-card');
    card.innerHTML = `
      <div class="exp-top">
        <div><div class="co">${job.company}</div><div class="loc">${job.location}</div></div>
        <div class="dates">${job.dates}</div>
      </div>
      <div class="exp-role">${job.role}</div>
      <div class="exp-metrics">${job.metrics.map(m=>`<div class="m"><div class="n">${m.n}</div><div class="l">${m.l}</div></div>`).join('')}</div>
      <ul class="exp-list">${job.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
    `;
    wrap.appendChild(card);
  });
}

function renderProjects(){
  const wrap = document.getElementById('projList');
  wrap.innerHTML = '';
  SITE_DATA.projects.forEach((proj, i)=>{
    const card = el('div', 'project' + (i % 2 === 1 ? ' reverse' : ''));
    const mediaInner = proj.image
      ? `<img src="${proj.image}" alt="${proj.title} cover image" loading="lazy">`
      : (proj.icon === 'uav' ? UAV_ICON : '');
    const linkHtml = proj.link ? `<a class="p-link" href="${proj.link}" target="_blank" rel="noopener">${proj.linkLabel} ↗</a>` : '';
    card.innerHTML = `
      <div class="p-media"><span class="tag">${proj.tag}</span>${mediaInner}</div>
      <div class="p-body">
        <div class="p-eyebrow">${proj.dates}</div>
        <h3 class="p-title">${proj.title}</h3>
        <div class="p-role">${proj.role}</div>
        <p class="p-desc">${proj.description}</p>
        <div class="p-specs">${proj.specs.map(s=>`<div class="spec"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`).join('')}</div>
        <details class="p-notes"><summary>Engineering notes</summary><ul>${proj.notes.map(n=>`<li>${n}</li>`).join('')}</ul></details>
        ${linkHtml}
      </div>
    `;
    wrap.appendChild(card);
  });
}

const TAB_LABELS = { about: 'SHEET 1 OF 3 · ABOUT', experience: 'SHEET 2 OF 3 · EXPERIENCE', projects: 'SHEET 3 OF 3 · PROJECTS' };

function setTab(name, pushHash){
  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-' + name));
  document.getElementById('docTag').textContent = 'PORTFOLIO — ' + TAB_LABELS[name];
  if(pushHash) history.replaceState(null, '', '#' + name);
}

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=> setTab(btn.dataset.tab, true));
});

window.addEventListener('hashchange', ()=>{
  const name = location.hash.replace('#','');
  if(TAB_LABELS[name]) setTab(name, false);
});

renderHeader();
renderAbout();
renderExperience();
renderProjects();

const initial = location.hash.replace('#','');
setTab(TAB_LABELS[initial] ? initial : 'about', false);
</script>
